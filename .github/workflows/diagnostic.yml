name: Altyapi Sorgu Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run diagnostic script
        run: python check_altyapi.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_screenshot.png
            debug_page.html
            debug_elements.txt
